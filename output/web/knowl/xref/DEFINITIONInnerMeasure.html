<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">12.3.16</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Lebegue’s Inner Measure.</span>
</h4>
<div class="para logical">
<div class="para">Let <span class="process-math">\(S\subseteq [a,b] \subset \RR \)</span> be a set.  Then the <dfn class="terminology">inner measure</dfn> of <span class="process-math">\(S\)</span> is given by</div>
<div class="displaymath process-math">
\begin{equation}
\mu_i\left(S\right)=\sup
\left(\mu_o(K)\right)\tag{12.3.2}
\end{equation}
</div>
<div class="para">where <span class="process-math">\(K\subset S\)</span> is closed and bounded. </div>
