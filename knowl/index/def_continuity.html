</h2>
<div class="para">We say that a function <span class="process-math">\(f\)</span> is continuous at the point <span class="process-math">\(a\)</span> provided that for each <span class="process-math">\(\eps\gt0\text{,}\)</span> there exists a <span class="process-math">\(\delta\gt0\)</span> such that if <span class="process-math">\(\abs{x-a}\lt \delta\)</span> then <span class="process-math">\(|f(x)-f(a)|\lt \eps\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#def_continuity-4-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
